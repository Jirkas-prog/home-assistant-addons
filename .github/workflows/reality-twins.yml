name: Czech This View Publisher

on:
  push:
    branches: [main]
    paths: ['reality_twins/**', '.github/workflows/reality-twins.yml']
  pull_request:
    paths: ['reality_twins/**', '.github/workflows/reality-twins.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r reality_twins/requirements.txt
      - run: python -m unittest discover -s reality_twins/tests -v
      - run: node --check reality_twins/app/static/app.js
      - run: node --check reality_twins/app/static/browser.js
      - run: node --test reality_twins/tests/test_browser_view.cjs
      - run: node --test reality_twins/tests/test_calendar_settings.cjs
      - run: python -m compileall -q reality_twins/app
  image:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reality-twins:test reality_twins
      - run: docker run --rm --entrypoint python -v "$PWD/reality_twins/tests:/opt/reality-twins/tests:ro" reality-twins:test -m unittest discover -s tests -v
