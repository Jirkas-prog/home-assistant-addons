name: WorkFlow FastShare
slug: workflow_fastshare
version: "1.2.0"
description: Email download queue, local movie library, web player and MQTT dashboard card
url: https://github.com/Jirkas-prog/home-assistant-addons/tree/main/workflow_fastshare
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
ports:
  8098/tcp: null
ports_description:
  8098/tcp: Authenticated local web (managed in FastShare settings)
panel_icon: mdi:cloud-download
panel_title: FastShare
homeassistant_api: true
hassio_api: true
hassio_role: default
services:
  - mqtt:want
map:
  - type: media
    read_only: false
  - type: share
    read_only: false
  - type: homeassistant_config
    read_only: false
options: {}
schema: {}
